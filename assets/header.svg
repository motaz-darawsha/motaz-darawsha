<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060818"/>
      <stop offset="40%" stop-color="#12153a"/>
      <stop offset="100%" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- soft orbs -->
  <circle cx="180" cy="80" r="90" fill="#4f46e5" opacity="0.12"/>
  <circle cx="1020" cy="240" r="120" fill="#7c3aed" opacity="0.1"/>
  <circle cx="600" cy="300" r="80" fill="#6366f1" opacity="0.08"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#line)"/>

  <!-- geometric frame -->
  <rect x="48" y="48" width="1104" height="224" rx="16" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="56" y="56" width="1088" height="208" rx="12" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1"/>

  <!-- corner marks -->
  <path d="M48 78 L48 48 L78 48" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <path d="M1122 48 L1152 48 L1152 78" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <path d="M48 242 L48 272 L78 272" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <path d="M1122 272 L1152 272 L1152 242" fill="none" stroke="#a78bfa" stroke-width="2.5"/>

  <!-- name -->
  <text x="600" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">MOTAZ DARAWSHA</text>

  <!-- subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="3">BACKEND  ·  DISCORD INFRASTRUCTURE  ·  TYPESCRIPT</text>

  <!-- bottom line -->
  <rect x="350" y="210" width="500" height="1.5" fill="url(#line)"/>

  <!-- tags -->
  <text x="600" y="245" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#818cf8">node · queues · canvas cards · event-driven systems</text>
</svg>