<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="55%" stop-color="#0f1530"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1400" height="380" fill="url(#bg)"/>
  <rect width="1400" height="380" fill="url(#orb1)"/>
  <rect width="1400" height="380" fill="url(#orb2)"/>

  <!-- thin top bar -->
  <rect x="0" y="0" width="1400" height="2" fill="url(#accent)"/>

  <!-- left vertical accent -->
  <rect x="0" y="80" width="4" height="220" fill="#818cf8" opacity="0.9"/>

  <!-- main name -->
  <text x="80" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#name)" letter-spacing="-1">Motaz Darawsha</text>

  <!-- role -->
  <text x="80" y="220" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Backend Engineer</text>

  <!-- divider dot row -->
  <circle cx="80" cy="255" r="3" fill="#818cf8"/>
  <text x="96" y="260" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#cbd5e1">Discord bots · Queues · Canvas cards · TypeScript</text>

  <!-- right side panel -->
  <rect x="980" y="100" width="340" height="180" rx="16" fill="#0b1026" fill-opacity="0.65" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="1005" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">FOCUS</text>
  <text x="1005" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Music Bot Systems</text>
  <text x="1005" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">event-driven playback</text>
  <text x="1005" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">queue reliability</text>
  <text x="1005" y="255" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">card rendering</text>

  <!-- bottom accent -->
  <rect x="0" y="378" width="1400" height="2" fill="url(#accent)"/>
</svg>